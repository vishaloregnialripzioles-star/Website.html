name: Apply dashboard save flow

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[dashboard-save-patch]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch dashboard save behavior
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('server.js')
          text = path.read_text()

          old_url = "const COMMAND_HUB_API_URL = (process.env.COMMAND_HUB_API_URL || 'https://command-hub-2.onrender.com').replace(/\\/$/, '');"
          new_url = "const COMMAND_HUB_API_URL = (process.env.COMMAND_HUB_API_URL || 'https://server-1-05si.onrender.com').replace(/\\/$/, '');"
          if old_url in text:
              text = text.replace(old_url, new_url, 1)

          patch = r'''\n// Dashboard draft/save behavior: edits stay local until Done -> Save changes.\nlet dashboardDraft = {};\nlet dashboardSaved = {};\nlet dashboardDirty = false;\nfunction cloneDashboard(v){ return JSON.parse(JSON.stringify(v ?? {})); }\nfunction mergeDashboard(target, patch){\n  for (const [k,v] of Object.entries(patch || {})) {\n    if (v && typeof v === 'object' && !Array.isArray(v) && target[k] && typeof target[k] === 'object' && !Array.isArray(target[k])) target[k] = {...target[k], ...v};\n    else target[k] = v;\n  }\n}\nfunction markDashboardDirty(){ dashboardDirty = true; renderDashboardSaveBar(); }\nfunction renderDashboardSaveBar(){\n  let bar=document.getElementById('dashboard-savebar');\n  if(!dashboardDirty){ if(bar) bar.remove(); return; }\n  if(bar) return;\n  bar=document.createElement('div'); bar.id='dashboard-savebar';\n  bar.style='position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;background:#0d1017ee;border:1px solid #353c4a;box-shadow:0 18px 55px #0009;border-radius:12px;padding:10px 12px;z-index:9999;backdrop-filter:blur(14px)';\n  bar.innerHTML='<span style="color:#e5e8ef;font-weight:650;white-space:nowrap">⚠️ You have unsaved changes</span><button id="dashboard-reset" class="btn secondary">Reset</button><button id="dashboard-save" class="btn">Save changes</button>';\n  document.body.appendChild(bar);\n  document.getElementById('dashboard-reset').onclick=resetDashboardChanges;\n  document.getElementById('dashboard-save').onclick=saveDashboardChanges;\n}\nfunction save(body){\n  mergeDashboard(dashboardDraft, body);\n  if(body && body.autoResponders) responders = body.autoResponders;\n  cfg = {...cfg, ...dashboardDraft};\n  renderResponders();\n  markDashboardDirty();\n  toast('Changes are waiting to be saved');\n}\nfunction dashboardSnapshotFromDom(){\n  const a={enabled:on('automodEnabled'),antiSpam:on('antiSpam'),antiScam:on('antiScam'),massMentions:on('massMentions'),suspiciousLinks:on('suspiciousLinks'),bannedWords:document.getElementById('bannedWords').value.split('\\n').map(x=>x.trim()).filter(Boolean),action:document.getElementById('automodAction').value};\n  const ai={enabled:on('aiEnabled'),mentionOnly:on('mentionOnly'),channelId:document.getElementById('aiChannel').value.trim()||undefined};\n  const gw={enabled:on('giveawayEnabled'),channelId:document.getElementById('giveawayChannel').value.trim()||undefined,message:document.getElementById('giveawayMessage').value};\n  return {prefix:document.getElementById('prefix').value.trim()||'.',logChannel:document.getElementById('logChannel').value.trim()||undefined,autoResponders:responders,automod:a,ai,giveawayDaily:gw};\n}\nasync function saveDashboardChanges(){\n  const body=dashboardSnapshotFromDom();\n  const r=await fetch('/dashboard/api/'+id+'/config',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});\n  const d=await r.json().catch(()=>({}));\n  if(!r.ok){toast(d.error||'Save failed');return;}\n  cfg=d.config||cfg; responders=d.autoResponders||responders; dashboardDraft={}; dashboardSaved=cloneDashboard(body); dashboardDirty=false; renderDashboardSaveBar(); toast('Changes saved to this server');\n}\nfunction resetDashboardChanges(){\n  dashboardDraft={}; dashboardDirty=false; applyDashboardSaved(); renderDashboardSaveBar(); toast('Changes reset');\n}\nfunction applyDashboardSaved(){\n  const s=dashboardSaved||{};\n  if(s.prefix!==undefined) document.getElementById('prefix').value=s.prefix;\n  document.getElementById('logChannel').value=s.logChannel||'';\n  responders=cloneDashboard(s.autoResponders||[]);\n  const a=s.automod||{}; setSwitch('automodEnabled',a.enabled);setSwitch('antiSpam',a.antiSpam);setSwitch('antiScam',a.antiScam);setSwitch('massMentions',a.massMentions);setSwitch('suspiciousLinks',a.suspiciousLinks);document.getElementById('bannedWords').value=(a.bannedWords||[]).join('\\n');document.getElementById('automodAction').value=a.action||'delete_timeout';\n  const ai=s.ai||{};setSwitch('aiEnabled',ai.enabled);setSwitch('mentionOnly',ai.mentionOnly);document.getElementById('aiChannel').value=ai.channelId||'';\n  const gw=s.giveawayDaily||{};setSwitch('giveawayEnabled',gw.enabled);document.getElementById('giveawayChannel').value=gw.channelId||'';document.getElementById('giveawayMessage').value=gw.message||'🎁 Don’t forget to enter our active giveaway!';renderResponders();\n}\nconst originalLoad=load;\nload=async function(){\n  await originalLoad();\n  dashboardSaved=cloneDashboard(dashboardSnapshotFromDom()); dashboardDraft={}; dashboardDirty=false; renderDashboardSaveBar();\n  ['prefix','logChannel','bannedWords','giveawayChannel','giveawayMessage','aiChannel'].forEach(x=>document.getElementById(x)?.addEventListener('input',markDashboardDirty));\n  document.getElementById('automodAction')?.addEventListener('change',markDashboardDirty);\n  document.querySelectorAll('[onclick]').forEach(btn=>{ const fn=btn.getAttribute('onclick')||''; if(/^save(General|Automod|Ai|Giveaway)\(\)$/.test(fn)) btn.textContent='Done'; });\n};\n'''

          marker = "load();\n</script>"
          if marker not in text:
              raise SystemExit('dashboard load marker not found')
          if 'Dashboard draft/save behavior' not in text:
              text = text.replace(marker, patch + "\nload();\n</script>", 1)

          path.write_text(text)
          PY
          node --check server.js
          rm -f .github/workflows/apply-dashboard-save-flow.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js .github/workflows/apply-dashboard-save-flow.yml
          git commit -m "Add per-server dashboard save flow [dashboard-save-patch]"
          git push
